<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>İtemHan Pazaryeri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Cinzel:wght@700;900&family=Bungee&family=Russo+One&family=Black+Ops+One&family=Orbitron:wght@700;900&display=swap">
<style>
/* Layout: hanın pazar avlusu — sol sütun serverlar, orta ilan akışı, sağ sütun ücretli reklam alanları */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface-2:#e9edf4; --line:#d5dbe7; --fg:#121927; --muted:#56627b;
  --accent:#b46800; --accent-hi:#d98a17; --accent-ink:#ffffff; --accent-2:#13789a; --gold-soft:#fbf0dc;
  --hdr:#121a2a; --hdr-2:#1a2438; --hdr-fg:#eef1f7; --hdr-muted:#97a3bd;
  --ok:#1a8f5a; --ok-soft:#e1f4ea; --warn:#a96e00; --warn-soft:#fbf0d6; --bad:#cc3333; --bad-soft:#fbe4e4; --info-soft:#e0f0f6;
  --shadow:0 1px 2px rgba(18,25,39,.06),0 8px 24px rgba(18,25,39,.07);
  --f-display:'Saira Condensed','Arial Narrow',sans-serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c111b; --surface:#141b2a; --surface-2:#1a2335; --line:#263149; --fg:#e6eaf2; --muted:#8f9bb5;
  --accent:#f0a338; --accent-hi:#ffbb55; --accent-ink:#1d1305; --accent-2:#4bbcdc; --gold-soft:#2a2215;
  --hdr:#090d16; --hdr-2:#111827; --hdr-fg:#eef1f7; --hdr-muted:#8b97b0;
  --ok:#3cc986; --ok-soft:#12291f; --warn:#f0b64a; --warn-soft:#2b2312; --bad:#f06666; --bad-soft:#311819; --info-soft:#10283a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#141b2a; --surface-2:#1a2335; --line:#263149; --fg:#e6eaf2; --muted:#8f9bb5;
  --accent:#f0a338; --accent-hi:#ffbb55; --accent-ink:#1d1305; --accent-2:#4bbcdc; --gold-soft:#2a2215;
  --hdr:#090d16; --hdr-2:#111827; --hdr-fg:#eef1f7; --hdr-muted:#8b97b0;
  --ok:#3cc986; --ok-soft:#12291f; --warn:#f0b64a; --warn-soft:#2b2312; --bad:#f06666; --bad-soft:#311819; --info-soft:#10283a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* üst şerit (metin reklam) */
.strip{background:var(--hdr-2);color:var(--hdr-fg);font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.06)}
.strip .wrap{display:flex;align-items:center;gap:12px;padding-block:6px}
.strip-tag{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:4px;flex:none}
.marquee{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.marquee-in{display:inline-flex;gap:40px;white-space:nowrap;animation:mq 38s linear infinite;padding-left:100%}
.marquee-in a{color:var(--hdr-fg)} .marquee-in a:hover{color:var(--accent-hi)}
.marquee-in b{color:var(--accent-hi);font-weight:600}
@keyframes mq{to{transform:translateX(-100%)}}
.demo-sw{display:flex;align-items:center;gap:6px;flex:none;color:var(--hdr-muted)}
.demo-sw select{background:var(--hdr);border:1px solid rgba(255,255,255,.14);color:var(--hdr-fg);border-radius:6px;padding:3px 6px;font-size:12px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);color:var(--hdr-fg);box-shadow:0 2px 12px rgba(0,0,0,.18)}
.hdr-in{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;flex:none}
.brand svg{width:30px;height:30px;color:var(--accent-hi)}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hdr-muted);margin-top:-4px}
.search{flex:1 1 280px;display:flex;min-width:0;background:var(--hdr-2);border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden}
.search input{flex:1;min-width:0;background:none;border:0;padding:10px 12px;color:var(--hdr-fg)}
.search input::placeholder{color:var(--hdr-muted)}
.search button{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 16px}
.hdr-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;background:var(--hdr-2);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px 10px;color:var(--hdr-fg)}
.bal small{font-size:10.5px;color:var(--hdr-muted);text-transform:uppercase;letter-spacing:.06em}
.bal b{font-family:var(--f-mono);font-size:14px}
.bal span{font-size:11px;color:var(--accent-hi);font-weight:600}
.me{display:flex;align-items:center;gap:8px;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--accent-2);color:#fff;flex:none;font-size:15px}
.cats{background:var(--surface);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cats a{padding:12px 12px;font-weight:600;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent}
.cats a:hover{color:var(--fg)}
.cats a.on{color:var(--fg);border-bottom-color:var(--accent)}
.cats a.hot{color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 14px;font-weight:600;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.2);color:var(--hdr-fg)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* layout */
main{padding-block:20px 60px;min-height:60vh}
.home{display:grid;grid-template-columns:236px minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:1100px){.home{grid-template-columns:220px minmax(0,1fr)}.home .rcol{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}}
@media (max-width:760px){.home{grid-template-columns:minmax(0,1fr)}.home .lcol{order:2}.home .mcol{order:1}.home .rcol{order:3}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.panel-h a{font-size:12.5px;color:var(--accent);font-weight:600}
.panel-b{padding:14px}
.eyebrow{font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sponsor{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* server logo & list */
.slogo{width:var(--sz);height:var(--sz);border-radius:8px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:calc(var(--sz)*.42);flex:none;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.slist{display:flex;flex-direction:column}
.sitem{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.sitem:last-child{border-bottom:0}
.sitem:hover{background:var(--surface-2)}
.sitem .n{font-weight:700;line-height:1.2}
.sitem .m{font-size:11.5px;color:var(--muted)}
.sitem .o{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ok);white-space:nowrap}
.sitem.prem{background:linear-gradient(90deg,var(--gold-soft),transparent)}
.sitem.prem .n::after{content:"PREMIUM";margin-left:6px;font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--accent);vertical-align:2px}

/* slider */
.slider{position:relative;border-radius:var(--r);overflow:hidden;background:var(--hdr);min-height:210px}
.slides{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.slide{flex:0 0 100%;position:relative;padding:26px 26px 44px;color:#fff;min-height:210px;display:flex;align-items:center;gap:22px;background:linear-gradient(120deg,var(--c1),var(--c2))}
.slide::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 30%,rgba(255,255,255,.22),transparent 45%),repeating-linear-gradient(135deg,rgba(0,0,0,.06) 0 2px,transparent 2px 12px)}
.slide>*{position:relative}
.slide .slogo{--sz:92px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.3)}
.slide h2{font-size:clamp(26px,4vw,40px);font-weight:800;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.slide p{margin:6px 0 14px;max-width:46ch;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.slide .sponsor{color:rgba(255,255,255,.8)}
.slide .btn{border-color:rgba(255,255,255,.6);background:rgba(0,0,0,.25);color:#fff}
.slide .btn-primary{background:#fff;color:#111;border-color:#fff}
.dots{position:absolute;bottom:12px;left:26px;display:flex;gap:6px}
.dots button{width:22px;height:5px;border-radius:3px;border:0;background:rgba(255,255,255,.4);padding:0}
.dots button.on{background:#fff;width:34px}
@media (max-width:560px){.slide{flex-direction:column;align-items:flex-start;gap:12px}.slide .slogo{--sz:60px}}

/* trust row */
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trust div{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;font-size:12.5px;color:var(--muted)}
.trust b{display:block;color:var(--fg);font-size:13.5px}
.trust svg{width:22px;height:22px;flex:none;color:var(--accent)}
@media (max-width:620px){.trust{grid-template-columns:minmax(0,1fr)}}

/* listing rows */
.lrows{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) 170px 120px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);position:relative}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow.is-renk{background:var(--info-soft)}
.lrow.is-vitrin{box-shadow:inset 3px 0 0 var(--accent)}
.lrow-t{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.lrow-m{font-size:12px;color:var(--muted);margin-top:2px}
.lrow-s{font-size:12.5px;line-height:1.3;min-width:0}
.lrow-s b{font-weight:600}
.lrow-s small{display:block;color:var(--muted)}
.lrow-p{text-align:right}
.lrow-p b{font-family:var(--f-mono);font-size:15px;color:var(--accent);display:block;white-space:nowrap}
.lrow-p small{color:var(--muted);font-size:11.5px}
@media (max-width:760px){.lrow{grid-template-columns:44px minmax(0,1fr) auto}.lrow-s{display:none}}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;vertical-align:1px;margin-right:5px}
.b-acil{background:var(--bad);color:#fff}
.b-vitrin{background:var(--accent);color:var(--accent-ink)}
.b-st{background:#cf6a32;color:#fff}
.vchk{color:var(--accent-2);font-size:12px}
.gbadge{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-weight:800;color:var(--muted)}

/* cs2 skins */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:14px}
.skin{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .15s,border-color .15s}
.skin:hover{transform:translateY(-2px);border-color:var(--r-c)}
.skin-art{height:96px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--r-c) 38%,transparent),transparent 70%);color:var(--fg);border-bottom:3px solid var(--r-c)}
.skin-art svg{width:78%;max-height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));color:color-mix(in srgb,var(--r-c) 55%,var(--fg))}
.skin-b{padding:9px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.skin-w{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.skin-w .mono{font-size:10.5px}
.skin-n{font-weight:600;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.skin-n em{font-style:normal;color:#cf6a32;font-weight:700}
.skin-p{margin-top:auto;padding-top:4px;font-family:var(--f-mono);font-weight:700;color:var(--accent)}
.skin .badge{position:absolute;top:8px;left:8px}
.fbar{height:4px;border-radius:2px;background:linear-gradient(90deg,#3cb371 0 7%,#9acd32 7% 15%,#f0c419 15% 38%,#f08a24 38% 45%,#e04b4b 45% 100%);position:relative;margin-top:2px}
.fbar i{position:absolute;top:-3px;width:2px;height:10px;background:var(--fg);left:var(--f)}

/* banners */
.ban{display:block;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:300/250;max-width:100%;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.ban::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.25),transparent 40%),linear-gradient(transparent 40%,rgba(0,0,0,.45))}
.ban>*{position:relative}
.ban .slogo{--sz:54px;position:absolute;top:16px;left:16px}
.ban .sponsor{position:absolute;top:12px;right:12px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px}
.ban h3{font-size:26px;font-weight:800;text-transform:uppercase}
.ban p{margin:0;font-size:13px;opacity:.95}
.ban-empty{aspect-ratio:300/250;border:2px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px;color:var(--muted)}
.ban-empty b{font-family:var(--f-display);font-size:20px;color:var(--fg);text-transform:uppercase}
.feed{display:flex;flex-direction:column}
.feed div{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.feed div:last-child{border-bottom:0}
.feed span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed time{color:var(--muted);white-space:nowrap;font-size:11.5px}

/* category page */
.cat-l{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cat-l{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
textarea.inp{resize:vertical;min-height:90px}
.inp:focus{border-color:var(--accent);outline:none}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.row3{grid-template-columns:minmax(0,1fr)}}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-size:clamp(28px,4vw,38px);font-weight:800;text-transform:uppercase}
.page-h p{margin:4px 0 0;color:var(--muted)}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumbs a:hover{color:var(--accent)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

/* listing detail */
.det{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.det{grid-template-columns:minmax(0,1fr)}}
.det-hero{display:flex;gap:16px;align-items:center;padding:18px}
.det-hero .slogo{--sz:72px;border-radius:14px}
.det-hero h1{font-size:clamp(24px,3.4vw,32px);font-weight:700}
.det-art{height:220px;display:grid;place-items:center;border-radius:var(--r) var(--r) 0 0;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--r-c) 40%,transparent),transparent 70%),var(--surface-2);border-bottom:4px solid var(--r-c)}
.det-art svg{width:min(70%,420px);color:color-mix(in srgb,var(--r-c) 55%,var(--fg));filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid var(--line)}
.kv div{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.kv div:nth-child(odd){color:var(--muted);background:var(--surface-2)}
.desc{padding:14px;white-space:pre-wrap;line-height:1.6}
.buy{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:900px){.buy{position:static}}
.price-big{font-family:var(--f-mono);font-size:30px;font-weight:700;color:var(--accent);line-height:1}
.guard{display:flex;gap:10px;background:var(--ok-soft);border-radius:8px;padding:11px 12px;font-size:12.5px;line-height:1.45}
.guard svg{width:22px;height:22px;color:var(--ok);flex:none}
.seller{display:flex;align-items:center;gap:12px}
.seller .av{width:44px;height:44px;font-size:19px}
.stars{color:var(--accent);letter-spacing:1px}
.sum{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sum div{display:flex;justify-content:space-between;gap:10px}

/* order */

.step i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);font-style:normal;font-weight:700;position:relative;z-index:1;font-family:var(--f-mono);font-size:12px}
.step.done{color:var(--fg)} .step.done i{background:var(--ok);border-color:var(--ok);color:#fff} .step.done::before{background:var(--ok)}
.step.cur i{border-color:var(--accent);color:var(--accent)} .step.cur{color:var(--fg);font-weight:600}
.step.bad i{background:var(--bad);border-color:var(--bad);color:#fff}
.note{border-radius:8px;padding:12px;font-size:13px;line-height:1.5}

.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:11.5px;text-align:center;max-width:100%}
.msg small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.msg.agent{background:var(--info-soft)}
.chat-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.chat-in input{flex:1;min-width:0}

/* tables */
.tbl-w{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}

.tbl tr:last-child td{border-bottom:0}

.tbl th.num{text-align:right}
.pos{color:var(--ok)} .neg{color:var(--bad)}

.p-tamam{background:var(--ok-soft);color:var(--ok)}

/* account / admin */

.tabs button:hover{background:var(--surface-2);color:var(--fg)}
.tabs button.on{background:var(--gold-soft);color:var(--fg)}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 7px;line-height:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.tk-list button b{display:block;font-size:13px}

/* ilan ver */
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

}

.mock .z-yan.l{left:1px}.mock .z-yan.r{right:1px}

.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pack{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}

.dur label:has(input:checked){border-color:var(--accent);background:var(--gold-soft)}

/* servers page */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.shero{border-radius:14px;padding:26px;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2));display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:20px;position:relative;overflow:hidden}

function refCheck(b,total){ const s=S.set; if(!s.refOn||!b.refBy||b.refPaid||total<s.refMin) return; const R=S.users.find(x=>x.id===b.refBy); if(!R||(R.refs||0)>=s.refMax) return; b.refPaid=true; R.refs=(R.refs||0)+1;
  if(s.refBonus){ addBonus(R,s.refBonus); addTx(R.id,`Davet ödülü (${b.name}) · sadece alışveriş`,s.refBonus); ledger('bonus',R.id,s.refBonus,{m:'Davet ödülü'}); notify(R.id,`${b.name} ilk alışverişini yaptı, ${TL(s.refBonus)} davet ödülü kazandın.`,'#hesabim'); }
  if(s.refFriend){ addBonus(b,s.refFriend); addTx(b.id,'Davet hoş geldin ödülü · sadece alışveriş',s.refFriend); ledger('bonus',b.id,s.refFriend,{m:'Davet hoş geldin'}); notify(b.id,`Davet koduyla ilk alışverişin için ${TL(s.refFriend)} hediye bakiye yüklendi.`,'#hesabim'); } }
function addTx(u,l,a){S.tx.unshift({id:uid('t'),u,l,a:r2(a),t:now()})}
function wdFee(a){ const f=S.set.wdFee||{}; if(!f.on||!(a>0)) return 0; let x=f.type==='yuzde'?a*(+f.val||0)/100:(+f.val||0); if(f.type==='yuzde'){ if(+f.min>0) x=Math.max(x,+f.min); if(+f.max>0) x=Math.min(x,+f.max); } return r2(Math.min(x,a)); }
function wdFeeTxt(){ const f=S.set.wdFee||{}; if(!f.on) return 'Ücretsiz'; return f.type==='yuzde'?`%${f.val}${+f.min>0?' (en az '+TL(f.min)+')':''}${+f.max>0?' (en fazla '+TL(f.max)+')':''}`:TL(f.val)+' / işlem'; }
function addRev(k,a){S.rev[k]=r2((S.rev[k]||0)+a); S.revLog.push({t:now(),k,a:r2(a)})}
const RCATS={yang:'Yang / Won ilanları',item:'Item ilanları',karakter:'Karakter ilanları',ep:'EP ilanları (PVP)',epstore:'Metin2 EP mağazası',borsa:'Yang Borsası alımları'};
const vipIdx = id => Math.max(0,VIP.findIndex(v=>v.id===id));
const rOk = (r,u) => !!u && (!r.minVip || vipIdx(vip(u).id) >= vipIdx(r.minVip));
const rPer = r => Math.max(1,+r.per||100);
const rCap = (r,uid_,n) => r.maxTk>0 ? Math.max(0,Math.min(n,r.maxTk-((r.tk||{})[uid_]||0))) : n;
function raffleSpend(uid_,amt,cat){ const u=user(uid_); const got=[]; activeRaffles().forEach(r=>{ if(!rOk(r,u)) return; if(r.cats&&r.cats.length&&!r.cats.includes(cat)) return; r.acc=r.acc||{}; r.acc[uid_]=r2((r.acc[uid_]||0)+amt); let n=Math.floor(r.acc[uid_]/rPer(r)); if(n<=0) return; r.acc[uid_]=r2(r.acc[uid_]-n*rPer(r)); n=rCap(r,uid_,n); if(n<=0) return; r.tk[uid_]=(r.tk[uid_]||0)+n; got.push({r,n}); });
  if(got.length) notify(uid_,`Çekiliş bileti kazandın: ${got.map(g=>g.n+' bilet · '+g.r.title).join(', ')}`,'#cekilis','ticket'); return got; }
function rCond(r){ const L=[]; L.push(`Her <b>${TL(rPer(r))}</b> alışverişte 1 bilet`); L.push(r.cats&&r.cats.length?`Geçerli: ${r.cats.map(c=>RCATS[c]||c).join(', ')}`:'Geçerli: tüm alışverişler'); if(r.minVip){ const v=VIP.find(x=>x.id===r.minVip); if(v) L.push(`Katılım: <span class="vip" style="background:${v.c}">${v.n}</span> ve üzeri üyeler`); } if(r.maxTk>0) L.push(`Kişi başı en fazla ${r.maxTk} bilet`); if(r.free!==false) L.push('Günde 1 ücretsiz bilet'); return L; }
function addTickets(u,n){ if(n<=0) return; const U=user(u); activeRaffles().forEach(r=>{ if(!rOk(r,U)) return; const m=rCap(r,u,n); if(m>0) r.tk[u]=(r.tk[u]||0)+m; }); }
function toast(m,bad){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3400)}

function sortL(arr,mode){ const a=[...arr]; const dt=(x,y)=>(y.bump||y.t)-(x.bump||x.t); return mode==='ucuz'?a.sort((x,y)=>(x.price-y.price)||dt(x,y)):a.sort(dt); }

function emptyBox(t,s,btn){return `<div class="empty"><b>${t}</b>${s}${btn?`<div style="margin-top:12px">${btn}</div>`:''}</div>`}
function cdBox(t){const d=Math.max(0,t-now()); const g=Math.floor(d/D),h=Math.floor(d%D/H),m=Math.floor(d%H/60000),s=Math.floor(d%60000/1000); return `<div class="cd" data-cd="${t}"><span><b>${g}</b>gün</span><span><b>${String(h).padStart(2,'0')}</b>saat</span><span><b>${String(m).padStart(2,'0')}</b>dk</span><span><b>${String(s).padStart(2,'0')}</b>sn</span></div>`}

/* ================== sipariş ================== */
function vOrder(id){
  const o=ord(id); if(!o) return vNotFound();
  const u=me(); if(!u||(u.id!==o.buyer&&u.id!==o.seller&&!can('siparis'))) return `<div class="wrap">${emptyBox('Bu siparişi görüntüleme yetkiniz yok','Sipariş yalnızca alıcı, satıcı ve yetkili ekibe açıktır.','<button class="btn btn-primary" data-act="login">Giriş Yap</button>')}</div>`;
  const isB=u.id===o.buyer, isS=u.id===o.seller, l=lst(o.lid)||{}, staff=can('siparis');
  const fee=o.fee??r2(o.total*o.rate/100), net=o.net??r2(o.total-fee);
  const idx={odendi:2,teslim:3,itiraz:3,tamam:5,iade:5}[o.status];
  const step=(n,t)=>{let c=''; if(o.status==='iade'&&n>=3) c='bad'; else if(n<idx||o.status==='tamam') c='done'; else if(n===idx) c='cur'; if(o.status==='itiraz'&&n===3) c='bad'; return `<div class="step ${c}"><i>${c==='done'?'✓':c==='bad'?'!':n}</i>${t}</div>`};
  const late=now()-o.t > delMin(l.del)*2*60000;
  let act='';
  if(o.status==='odendi'){
    if(isS) act=`<div class="note note-warn"><b>Ürününüz satıldı, teslimat sizden bekleniyor.</b> Teslimat bilgisi: <span class="mono">${esc(delivTxt(o))}</span>. ${late?'<b>Teslim süresi aşıldı, alıcı siparişi iptal edebilir.</b>':''}</div>
      <div class="fld"><label for="dnote">Teslimat notu (alıcı görür${l.cat==='ep'||l.cat==='epin'?' · kodu buraya yazın':''})</label><input class="inp" id="dnote" placeholder="${l.cat==='ep'||l.cat==='epin'?'EP kodu':'Örn: Köy 1, saat 21:14\'te ticaretle verildi'}"></div>
      <div class="dproofs"><div class="note note-info" style="font-size:12.5px">Teslim kanıtlarını yalnızca site yönetimi görür, alıcıya gösterilmez; olası bir anlaşmazlıkta sizi korur.</div>
        <div class="fld"><label for="dpre">1 · Teslimat öncesi görsel (zorunlu)</label><input class="inp" id="dpre" type="file" accept="image/*" multiple data-change="dprev" data-box="dprev_pre"><span class="muted" style="font-size:12px">Ticaret penceresi açıkken: verdiğiniz ürün / yang miktarı ve alıcının karakter adı görünsün. En fazla 3 görsel.</span><div id="dprev_pre" class="hstack"></div></div>
        <div class="fld"><label for="dpost">2 · Teslimat sonrası görsel (zorunlu)</label><input class="inp" id="dpost" type="file" accept="image/*" multiple data-change="dprev" data-box="dprev_post"><span class="muted" style="font-size:12px">Ticaret onaylandıktan sonra: envanterinizden ürünün / yangın düştüğü görünsün. En fazla 3 görsel.</span><div id="dprev_post" class="hstack"></div></div>
        <div class="fld"><label for="dvid">3 · Teslimat videosu (isteğe bağlı)</label><input class="inp" id="dvid" type="file" accept="video/mp4,video/webm,video/quicktime" data-change="dprev" data-box="dprev_vid"><span class="muted" style="font-size:12px">Ticaretin baştan sona kaydı varsa ekleyin; en fazla 60 MB. Anlaşmazlıkta en güçlü kanıttır.</span><div id="dprev_vid" class="hstack"></div></div></div>
      <button class="btn btn-primary" id="dbtn" data-act="deliver" data-id="${o.id}" disabled>Teslim Ettim</button>`;
    if(isS&&!late) act=(o.ready?`<div class="note note-ok"><b>Alıcıya “teslime hazır” bildirimi gönderildi</b> (${ago(o.ready)}). Teslimat: ${esc(teslimatTxt(o))}</div>`:`<div class="note note-info stack" style="gap:8px"><span><b>Teslime hazır mısınız?</b> Alıcıya SMS ve e-posta ile haber verelim: “${esc(teslimatTxt(o))}” noktasında beklesin.</span><div><button class="btn btn-ok btn-sm" data-act="o-ready" data-id="${o.id}">Teslime hazırım · alıcıya haber ver</button></div></div>`)+act;
    else if(isB) act= late ? `<div class="note note-warn"><b>Teslim süresi aşıldı.</b> Paranız havuzda güvende. İptal ve iade için canlı destekten talep oluşturun; ekibimiz satıcıyla görüşüp siparişi iptal eder.</div><div class="hstack"><button class="btn btn-primary" data-act="order-support" data-id="${o.id}">Canlı destekten iptal iste</button><button class="btn btn-sm" data-act="dispute" data-id="${o.id}">Sorun bildir</button></div>`
      : `${o.ready?`<div class="note note-ok"><b>Satıcı teslime hazır!</b> ${esc(teslimatTxt(o))}. Lütfen oyunda bekleyin.</div>`:''}<div class="note note-info"><b>Ödemeniz havuzda güvende.</b> Satıcıya “ürününüz satıldı” bildirimi ve SMS gitti. Teslim gecikirse canlı destekten iptal isteyebilirsiniz.</div><button class="btn btn-bad btn-sm" data-act="dispute" data-id="${o.id}">Sorun bildir</button>`;
    if(staff&&!isB&&!isS) act+=`<div class="note note-info">Yetkili işlemi: teslim edilmeyen siparişi iptal edebilirsiniz.</div><div class="hstack"><button class="btn btn-bad" data-act="resolve" data-id="${o.id}" data-to="buyer">Siparişi iptal et ve iade yap</button></div>`;
  } else if(o.status==='teslim'){
    const ac=(o.dt||o.t)+S.set.autoConfirm*H;
    if(isB) act=`<div class="note note-warn"><b>Satıcı teslim ettiğini bildirdi.</b> Ürünü kontrol edin. ${left(ac)} içinde işlem yapmazsanız sipariş otomatik onaylanır.</div>
      <div class="fld"><span class="lbl">Satıcıyı puanlayın</span><div class="hstack" id="starPick">${[1,2,3,4,5].map(n=>`<button class="btn btn-sm" data-act="star" data-n="${n}" style="${n===5?'border-color:var(--accent)':''}">${n} ★</button>`).join('')}</div></div>
      <div class="hstack"><button class="btn btn-ok" data-act="confirm" data-id="${o.id}">Ürünü aldım, onaylıyorum</button><button class="btn btn-bad" data-act="dispute" data-id="${o.id}">Sorun var, itiraz et</button></div>`;
    else act=`<div class="note note-info">Alıcının onayı bekleniyor. Onay gelmezse ${left(ac)} sonra otomatik onaylanır ve ${TL(net)} hesabınıza geçer.</div>`;
  } else if(o.status==='itiraz'){
    act=`<div class="note note-bad"><b>İtiraz incelemede.</b> Gerekçe: ${esc(o.reason)}<br>Tutar havuzda bekletiliyor. Ekran görüntüsü ve kayıtlarınızı mesaj alanından iletin.</div>${o.proof?`<img src="${o.proof}" alt="İtiraz kanıtı" style="max-height:220px;border-radius:8px;border:1px solid var(--line)">`:''}`;
    if(staff) act+=`<div class="hstack"><button class="btn btn-ok" data-act="resolve" data-id="${o.id}" data-to="seller">Satıcı haklı · Ödemeyi aktar</button><button class="btn btn-bad" data-act="resolve" data-id="${o.id}" data-to="buyer">Alıcı haklı · İade et</button></div>`;
  } else if(o.status==='tamam'){
    act=`<div class="note note-ok"><b>Sipariş tamamlandı.</b> ${isS?`Hesabınıza ${TL(net)} aktarıldı.`:`İyi oyunlar! ${o.pts?NUM(o.pts)+' puan kazandınız.':''}`} ${o.stars?'Puan: <span class="stars">'+stars(o.stars)+'</span>':''}</div>`;
  } else if(o.status==='iade'){
    act=`<div class="note note-bad"><b>Sipariş iade edildi.</b> ${TL(o.total)} alıcının bakiyesine geri yüklendi.</div>`;
  }
  const who=f=>f===o.buyer?'Alıcı':f===o.seller?'Satıcı':'Destek';
  const B=user(o.buyer), Sl=user(o.seller);
  return `<div class="wrap"><div class="crumbs"><a href="#hesabim">Hesabım</a> › Sipariş #${o.id}</div>
  <div class="page-h"><div><h1>Sipariş #${o.id}</h1><p>${esc(o.title)} · ${o.qty} ${l.id?unitOf(l):'adet'} · ${dtstr(o.t)}${l.no?' · İlan #'+l.no:''}</p></div><span class="pill p-${o.status}">${ST[o.status]}</span></div>
  <div class="det"><div class="col">
    <div class="panel"><div class="steps">${step(1,'Ödeme havuzda')}${step(2,'Satıcı teslim etti')}${step(3,'Alıcı onayı')}${step(4,o.status==='iade'?'İade edildi':'Satıcıya ödendi')}</div><div class="panel-b stack" style="padding-top:4px">${act||'<div class="note note-info">Bu sipariş için yapılacak işlem yok.</div>'}</div></div>
    ${staff&&o.dproof&&o.dproof.length?`<div class="panel"><div class="panel-h"><h3>Teslim kanıtları</h3><span class="chip warn">Sadece yönetim görür</span></div><div class="panel-b stack">${o.dpre||o.dpost?[['dpre','Teslimat öncesi'],['dpost','Teslimat sonrası']].map(([g,lbl])=>`<div class="pgrp"><b>${lbl}</b>${(o[g]||[]).length?`<div class="proofs">${o[g].map((src,i)=>`<button class="proof" data-act="proof-open" data-id="${o.id}" data-g="${g}" data-i="${i}"><img src="${src}" alt="${lbl} ${i+1}"></button>`).join('')}</div>`:'<span class="muted" style="font-size:12.5px">Yüklenmedi</span>'}</div>`).join(''):`<div class="pgrp"><b>Teslim görselleri</b><div class="proofs">${o.dproof.map((src,i)=>`<button class="proof" data-act="proof-open" data-id="${o.id}" data-i="${i}"><img src="${src}" alt="Teslim görseli ${i+1}"></button>`).join('')}</div></div>`}
      <div class="pgrp"><b>Teslimat videosu</b>${o.dvid?`<video controls preload="metadata" data-dvid="${o.dvid}" style="width:100%;max-height:360px;border-radius:8px;background:#000"></video>`:'<span class="muted" style="font-size:12.5px">Satıcı video eklemedi (isteğe bağlı).</span>'}</div>
      <span class="muted" style="font-size:12px">${esc(user(o.seller).name)} · ${o.dt?dtstr(o.dt):''}</span></div></div>`:staff&&['teslim','itiraz','tamam'].includes(o.status)?`<div class="note note-info">Bu sipariş teslim görseli zorunluluğundan önce teslim edildi; görsel yok.</div>`:isS&&o.dproof?`<div class="note note-ok">Teslim kanıtlarınız (${o.dpre?o.dpre.length+' öncesi, '+(o.dpost||[]).length+' sonrası görsel':o.dproof.length+' görsel'}${o.dvid?', video':''}) yönetime iletildi. Alıcı bunları görmez.</div>`:''}<div class="panel"><div class="panel-h"><h3>Sipariş mesajları</h3><span class="muted" style="font-size:12px">Telefon, link ve site dışı iletişim otomatik gizlenir</span></div>
      <div class="chat" id="ochat">${o.log.map(e=>`<div class="msg sys">${dtstr(e.t)} · ${esc(e.x)}</div>`).concat(o.chat.map(m=>`<div class="msg ${m.f===u.id?'mine':m.f==='admin'||user(m.f).staff?'agent':''}"><b>${who(m.f)}</b> ${esc(m.x)}${m.flag?'<em class="flagnote">İletişim bilgisi gizlendi</em>':''}<small>${ago(m.t)}</small></div>`)).join('')}</div>
      ${['tamam','iade'].includes(o.status)?'':`<form class="chat-in" data-form="ochat" data-id="${o.id}"><input class="inp" id="omsg" placeholder="Mesaj yazın…" autocomplete="off"><button class="btn btn-primary">Gönder</button></form>`}</div>
  </div>
  <aside class="col"><div class="panel panel-b stack">
    <div class="eyebrow">Ödeme özeti</div>
    <div class="sum"><div><span>Ürün</span><span style="text-align:right">${esc(o.title)}</span></div><div><span>Miktar</span><span>${o.qty}</span></div><div class="tot"><span>Alıcının ödediği</span><span class="mono">${TL(o.total)}</span></div>
    ${isS||staff?`<div><span class="muted">Komisyon (%${o.rate})</span><span class="mono neg">−${TL(fee)}</span></div><div class="tot"><span>Satıcıya geçecek</span><span class="mono">${TL(net)}</span></div>`:''}</div>
    <div class="sum"><div><span class="muted">Alıcı</span><b>${esc(B.name)}${staff?' · '+esc(fullName(B)):''}</b></div><div><span class="muted">Satıcı</span><b>${esc(Sl.name)}${staff?' · '+esc(fullName(Sl)):''}</b></div><div><span class="muted">${o.ch||o.place?'Karakter adı':/@/.test(o.info||'')?'Devir e-postası':'Teslim bilgisi'}</span><span class="mono" style="font-size:11.5px;overflow-wrap:anywhere;text-align:right;max-width:60%">${esc(o.info||'-')}</span></div>${o.ch?`<div><span class="muted">Kanal</span><b>CH${esc(o.ch)}</b></div>`:''}${o.place?`<div><span class="muted">Teslimat yeri</span><b>${esc(o.place)}</b></div>`:''}</div>
    ${l.id?`<a href="#ilan-${l.id}" class="btn btn-sm">İlana git</a>`:''}
  </div></aside></div></div>`;
}

function sellCat(){ const g=(document.querySelector('input[name=game]:checked')||{}).value; if(g==='diger') return ({hesap:'karakter',epin:'ep',yang:'yang',item:'item'}[($('#s_dcat')||{}).value]||'item'); return ($('#s_cat')||{}).value||'yang'; }

function sellCalc(el){

function fileToDataURL(file,max){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,(max||640)/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/webp',.82)); }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

function wheelSvg(){
  const n=WHEEL.length, seg=360/n;
  const pt=(a,r)=>{const rad=(a-90)*Math.PI/180; return [Math.cos(rad)*r, Math.sin(rad)*r]};
  const slices=WHEEL.map((w,i)=>{const a0=i*seg,a1=(i+1)*seg; const [x0,y0]=pt(a0,96),[x1,y1]=pt(a1,96); const mid=a0+seg/2; const [tx,ty]=pt(mid,62);
    return `<path d="M0 0L${x0.toFixed(2)} ${y0.toFixed(2)}A96 96 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${w.c}" stroke="#fff" stroke-width="1.5"/><text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#fff" font-size="11" font-weight="700" font-family="Figtree,system-ui,sans-serif" text-anchor="middle" dominant-baseline="middle" transform="rotate(${mid} ${tx.toFixed(2)} ${ty.toFixed(2)})">${w.l}</text>`}).join('');
  return `<svg class="wheel" id="wheel" viewBox="-100 -100 200 200" style="transform:rotate(${ui.rot}deg)" role="img" aria-label="Şans çarkı"><circle r="99" fill="#111827"/>${slices}<circle r="22" fill="#111827" stroke="#fff" stroke-width="2"/><text y="1" fill="#ffbb55" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="middle" font-family="Figtree,system-ui,sans-serif">ÇEVİR</text></svg>`;
}

function spin(){
  const u=me(); if(!u||ui.spinning||S.spins[u.id]===today()) return;
  const tot=WHEEL.reduce((s,w)=>s+w.w,0); let r=Math.random()*tot, i=0; for(;i<WHEEL.length;i++){ r-=WHEEL[i].w; if(r<=0) break; } i=Math.min(i,WHEEL.length-1);
  const seg=360/WHEEL.length, center=i*seg+seg/2, target=(360-center)%360;
  const cur=((ui.rot%360)+360)%360; ui.rot=ui.rot+360*6+((target-cur+360)%360);
  ui.spinning=true; S.spins[u.id]=today(); save();
  const w=$('#wheel'); const b=$('#spinBtn'); if(b){b.disabled=true;b.textContent='Çevriliyor…';}
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(w) w.style.transform=`rotate(${ui.rot}deg)`;
  setTimeout(()=>{
    const p=WHEEL[i];
    if(p.k==='bal'){addBonus(u,p.v); addTx(u.id,'Şans çarkı ödülü · sadece alışveriş',p.v); ledger('bonus',u.id,p.v,{m:'Şans çarkı'});} else if(p.k==='pt'){u.pts=(u.pts||0)+p.v;} else if(p.k==='tk'){addTickets(u.id,p.v);}
    ui.spinning=false; save(); render(); toast(`Tebrikler! ${p.l} kazandın.`);
  }, reduce?300:4800);
}

const EXS={bekliyor:'İşlem bekliyor',islemde:'İşlem bekliyor · üstlenildi',bilgi:'İşlem bekliyor · bilgi istendi',kismen:'Kısmen teslim edildi',tamam:'Tamamlandı',iptal:'İptal edildi'};

const exM = x => (x.margin!=null&&x.margin!=='') ? +x.margin : +S.set.exMargin;

function exApplyFills(o,x,fills){ o.fills=o.fills||[]; fills.forEach(fl=>{ const of=S.exOffers.find(z=>z.id===fl.of); of.left-=fl.qty; if(of.left<=0){of.left=0; of.status='satildi';} notify(of.u,`Satış emriniz #${of.id}: ${fl.qty} adet eşleşti. Operatör hesabınıza girip yangı alacak.`,'#hesabim','borsa',{no:of.id,durum:'Eşleşti'}); const ex=o.fills.find(f=>f.of===fl.of&&f.price===fl.price); if(ex) ex.qty+=fl.qty; else o.fills.push(Object.assign({paidQty:0},fl)); }); o.fills.sort((a,b)=>a.price-b.price); o.cost=r2(o.fills.reduce((s,f)=>s+f.qty*f.price,0)); }
function exPair(o,of,q){ const x=S.exchange.find(e=>e.id===o.ex); const need=o.qty-exMatched(o); q=Math.floor(+q||0); if(!(q>0)) return toast('Eşlenecek adedi yazın.',true); if(q>need) return toast(`Bu siparişte eşlenecek ${need} adet kaldı.`,true); if(q>of.left) return toast(`Bu satış emrinde ${of.left} adet var.`,true);
  exApplyFills(o,x,[{of:of.id,u:of.u,qty:q,price:of.price,sell:o.price}]); const rest=o.qty-exMatched(o);
  o.log.push({t:now(),x:`${me().name} satış emri #${of.id} ile ${q} adet × ${TL(of.price)} eşledi.${rest>0?' Eşlenecek kalan: '+rest+' adet.':' Siparişin tamamı eşlendi.'}`});
  notify(o.u,`Borsa siparişiniz #${o.id}: ${q} adet hazırlanıyor.${rest>0?'':' Teslimat için operatör sizi çağıracak.'}`,'#hesabim','borsa',{no:o.id,durum:'Hazırlanıyor'}); return q; }
function exUnpair(o,ofId){ const fl=(o.fills||[]).find(f=>f.of===ofId&&(f.paidQty||0)<f.qty); if(!fl) return 0; const rest=fl.qty-(fl.paidQty||0); const of=S.exOffers.find(z=>z.id===ofId); if(of){ of.left+=rest; if(of.status==='satildi') of.status='aktif'; } fl.qty=fl.paidQty||0; o.fills=o.fills.filter(f=>f.qty>0); o.cost=r2(o.fills.reduce((t,f)=>t+f.qty*f.price,0)); o.log.push({t:now(),x:`${me().name} satış emri #${ofId} eşlemesini geri aldı (${rest} adet emre iade edildi).`}); return rest; }
function exMatch(x){ let n=0; S.exOrders.filter(o=>o.ex===x.id&&exOpenSt(o.status)&&exMatched(o)<o.qty).sort((a,b)=>a.t-b.t).forEach(o=>{ const need=o.qty-exMatched(o); const qt=exQuote(x,need); if(!qt.fills.length) return; exApplyFills(o,x,qt.fills); const got=qt.fills.reduce((s,f)=>s+f.qty,0); n+=got; const rest=o.qty-exMatched(o);
  o.log.push({t:now(),x:`Eksik miktar için ${got} adet en ucuz satış emirleriyle eşleşti (${qt.fills.map(f=>f.qty+' × '+TL(f.price)).join(', ')}).${rest>0?' Hâlâ eksik: '+rest+' adet.':' Siparişin tamamı karşılandı.'}`});
  notify(o.u,`Borsa siparişiniz #${o.id}: ${got} adet daha eşleşti.${rest>0?' Eksik: '+rest:' Siparişin tamamı karşılandı, teslimat yapılacak.'}`,'#hesabim','borsa',{no:o.id,durum:'Eşleşti'}); }); return n; }
function exDeliver(o,to){ const x=S.exchange.find(e=>e.id===o.ex)||{unit:''}; to=Math.max(0,Math.min(to,exMatched(o))); let add=to-(o.delivered||0); if(add<=0) return 0; let val=0, cost=0;
  for(const fl of o.fills){ if(add<=0) break; const n=Math.min(add,fl.qty-(fl.paidQty||0)); if(n<=0) continue; fl.paidQty=(fl.paidQty||0)+n; add-=n; const amt=r2(n*fl.price); val+=n*(fl.sell||fl.price); cost+=amt; const SU=user(fl.u); SU.bal=r2(SU.bal+amt); addTx(SU.id,`Borsa satışı (emir #${fl.of})`,amt); notify(SU.id,`Satış emrinizden ${n} adet satıldı, ${TL(amt)} bakiyenize geçti.`,'#hesabim','borsa',{no:fl.of,durum:'Ödendi'}); const of=S.exOffers.find(z=>z.id===fl.of); if(of&&of.status!=='aktif'&&fl.paidQty>=fl.qty) wipeOffer(of); }

function exFinish(o){ const actual=r2(o.fills.reduce((s,f)=>s+f.qty*(f.sell||f.price),0)); const back=r2(o.total-actual); if(back>0){ refundPart(user(o.u),o,back); addTx(o.u,`Borsa #${o.id} fiyat farkı iadesi`,back); o.log.push({t:now(),x:`Eksik miktar daha ucuza eşleştiği için ${TL(back)} fiyat farkı iade edildi.`}); o.total=actual; } o.reserve=0; }

function exSetDelivered(o,val){ const q=Math.floor(+val); const d=o.delivered||0; if(!(q>=0)) return toast('Geçerli bir adet yazın.',true);

  const all=await bkList(); if(all.length>30){ const tx=db.transaction(['m','d'],'readwrite'); all.slice(30).forEach(r=>{tx.objectStore('m').delete(r.id); tx.objectStore('d').delete(r.id);}); }
  if(!dataStr){ S.set.lastBk=meta.t; BKNOW=true; save(); BKNOW=false; } return meta; }

async function bkDel(id){ const db=await bkDB(); await new Promise(res=>{const tx=db.transaction(['m','d'],'readwrite'); tx.objectStore('m').delete(id); tx.objectStore('d').delete(id); tx.oncomplete=res; tx.onerror=res;}); }

function lsSend(x,extra){

  t.msgs.push(Object.assign({f:'u',x:c.text,t:now()},extra||{})); save();

function qnb_base(){ global $QNB; return $QNB['test'] ? 'https://test.qnbpay.com.tr/ccpayment' : 'https://portal.qnbpay.com.tr/ccpayment'; }

function qnb_post($yol, array $veri, $token = null){
  $h = ['Content-Type: application/json', 'Accept: application/json'];
  if($token) $h[] = 'Authorization: Bearer '.$token;
  $ch = curl_init(qnb_base().$yol);
  curl_setopt_array($ch, [CURLOPT_POST => true, CURLOPT_POSTFIELDS => json_encode($veri), CURLOPT_HTTPHEADER => $h, CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 45]);
  $cevap = curl_exec($ch);
  if($cevap === false){ $e = curl_error($ch); curl_close($ch); throw new Exception('QNBpay bağlantı hatası: '.$e); }
  curl_close($ch);
  return $cevap;
}

function qnb_token(){
  global $QNB;
  $j = json_decode(qnb_post('/api/token', ['app_id' => $QNB['app_id'], 'app_secret' => $QNB['app_secret']]), true);
  if(!isset($j['status_code']) || (int)$j['status_code'] !== 100 || empty($j['data']['token'])) throw new Exception('QNBpay token alınamadı: '.($j['status_description'] ?? 'bilinmeyen hata'));
  return $j['data']['token'];
}

// hash_key: QNBpay dokümanındaki AES-256-CBC yöntemi (iv:salt:şifreli, "/" yerine "__")
function qnb_hash($duz){
  global $QNB;
  $iv   = substr(sha1(random_bytes(16)), 0, 16);
  $salt = substr(sha1(random_bytes(16)), 0, 4);
  $key  = substr(hash('sha256', sha1($QNB['app_secret']).$salt), 0, 32);
  return str_replace('/', '__', $iv.':'.$salt.':'.openssl_encrypt($duz, 'aes-256-cbc', $key, 0, $iv));
}
function qnb_hash_coz($hash){
  global $QNB;
  $p = explode(':', str_replace('__', '/', (string)$hash));
  if(count($p) < 3) return null;
  $key = substr(hash('sha256', sha1($QNB['app_secret']).$p[1]), 0, 32);
  $duz = openssl_decrypt($p[2], 'aes-256-cbc', $key, 0, $p[0]);
  return $duz === false ? null : explode('|', $duz);
}

function kayit_dosya($inv){ return QNB_KAYIT.'/'.preg_replace('/[^A-Za-z0-9_-]/', '', $inv).'.json'; }
function kayit_oku($inv){ $f = kayit_dosya($inv); return is_file($f) ? json_decode(file_get_contents($f), true) : null; }
function kayit_yaz(array $k){ file_put_contents(kayit_dosya($k['invoice_id']), json_encode($k, JSON_UNESCAPED_UNICODE), LOCK_EX); }

// Ödemeyi QNBpay'e sorarak doğrular ve bakiyeyi yalnızca bir kez yükler.
// Tarayıcıdan gelen veriye değil, QNBpay'in kendi cevabına güvenir.
function qnb_tamamla($inv){
  global $QNB;
  $kilit = fopen(QNB_KAYIT.'/.kilit', 'c'); flock($kilit, LOCK_EX);
  try{
    $k = kayit_oku($inv);
    if(!$k) return 'yok';
    if($k['durum'] === 'odendi') return 'odendi';
    $j = json_decode(qnb_post('/api/checkstatus', ['merchant_key' => $QNB['merchant_key'], 'invoice_id' => $inv, 'hash_key' => qnb_hash($inv.'|'.$QNB['merchant_key'])], qnb_token()), true);
    $ok = isset($j['status_code']) && (int)$j['status_code'] === 100
       && in_array(strtolower((string)($j['transaction_status'] ?? '')), ['completed', 'complete', 'success'], true);
    if(!$ok){ $k['son_kontrol'] = $j; kayit_yaz($k); return 'basarisiz'; }
    bakiye_yukle($k['uye_id'], $k['tutar'], $inv);
    $k['durum'] = 'odendi'; $k['odeme_t'] = time(); kayit_yaz($k);
    return 'odendi';
  } finally { flock($kilit, LOCK_UN); fclose($kilit); }
}

/* basit ZIP (sıkıştırmasız) */
function zipFiles(files){ const enc=new TextEncoder(); const T=(()=>{const t=new Uint32Array(256); for(let n=0;n<256;n++){let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0;} return t;})();
  const crc=b=>{let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0;};
  const d=new Date(), dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  const parts=[], cen=[]; let off=0;
  files.forEach(([name,txt])=>{ const nb=enc.encode(name), db=enc.encode(txt), c=crc(db);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true); h.setUint32(14,c,true); h.setUint32(18,db.length,true); h.setUint32(22,db.length,true); h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,db);
    const e=new DataView(new ArrayBuffer(46)); e.setUint32(0,0x02014b50,true); e.setUint16(4,20,true); e.setUint16(6,20,true); e.setUint16(8,0x0800,true); e.setUint16(10,0,true); e.setUint16(12,dt,true); e.setUint16(14,dd,true); e.setUint32(16,c,true); e.setUint32(20,db.length,true); e.setUint32(24,db.length,true); e.setUint16(28,nb.length,true); e.setUint32(42,off,true);
    cen.push(new Uint8Array(e.buffer),nb); off+=30+nb.length+db.length; });
  const cs=cen.reduce((a,b)=>a+b.length,0); const z=new DataView(new ArrayBuffer(22)); z.setUint32(0,0x06054b50,true); z.setUint16(8,files.length,true); z.setUint16(10,files.length,true); z.setUint32(12,cs,true); z.setUint32(16,off,true);
  const all=[...parts,...cen,new Uint8Array(z.buffer)]; const out=new Uint8Array(all.reduce((a,b)=>a+b.length,0)); let p=0; all.forEach(b=>{out.set(b,p); p+=b.length;}); return out; }

function doBuy(id,q,info,ext){ ext=ext||{};
  const u=me(), l=lst(id), tot=r2(l.price*q);
  if(!l||l.stock<q||l.status!=='aktif') return toast('Bu ilan artık satışta değil.',true);

  const rawInfo=l.cat==='karakter'||l.cat==='hesap'||l.cat==='ep'||l.cat==='epin'||l.game==='cs2';
  if(rawInfo&&l.game!=='cs2'&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(info)) return toast('Geçerli bir e-posta adresi yazın.',true);
  if(!rawInfo&&!String(info||'').trim()) return toast('Karakter adınızı yazın.',true);
  const paid=spend(u,tot); l.stock-=q; if(l.stock<=0){l.stock=0;l.status='satildi';}
  const o={id:'S'+(100000+(++S.seq)),lid:l.id,title:l.title,buyer:u.id,seller:l.seller,qty:q,total:tot,rate:rateFor(l.seller),status:'odendi',t:now(),info:rawInfo?String(info).trim().slice(0,200):censor(info).text,ch:ext.ch||'',place:DPLACE.includes(ext.place)?ext.place:'',paid,log:[{t:now(),x:'Ödeme alındı, tutar güvenli havuza aktarıldı. Satıcıya bildirim ve SMS gönderildi.'}],chat:[]};

  S.orders.unshift(o); addTx(u.id,'Satın alma #'+o.id,-tot); track('satin',{value:tot,transaction_id:o.id});
  notify(l.seller,`“${l.title}” ilanınız satıldı (#${o.id}). Teslimat: ${teslimatTxt(o)}. Lütfen siparişi açıp teslim edin.`,'#siparis-'+o.id,'sold',{ilan:l.title,no:o.id,teslimat:teslimatTxt(o),tutar:TL(tot)}); notify(u.id,`#${o.id} siparişiniz alındı. Ödemeniz havuzda güvende; satıcı teslime hazır olunca haber vereceğiz.`,'#siparis-'+o.id,'order_new',{ilan:l.title,no:o.id,tutar:TL(tot),teslimat:teslimatTxt(o)}); if(l.status==='satildi'&&l.stock<=0&&(o.qty>1||S.orders.filter(x=>x.lid===l.id).length>1)) notify(l.seller,`“${l.title}” ilanınızın stoğu bitti, ilan yayından kalktı.`,'#hesabim','stock_out',{ilan:l.title});
  save(); closeModal(); toast('Ödeme alındı. Satıcıya bildirim gönderildi.'); go('siparis-'+o.id);

}

const slugify = s => String(s||'').toLocaleLowerCase('tr-TR').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/İ/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/â/g,'a').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70)||'sayfa';
const siteBase = () => (S.set.siteUrl||'https://www.itemhan.com').replace(/\/+$/,'');
const isLive = () => /^https?:$/.test(location.protocol) && !/claude|anthropic|localhost|127\.0\.0\.1/.test(location.hostname);
const seoClean = () => (!!window.__SEO_CLEAN||!!(S.set.seo&&S.set.seo.clean)) && isLive();
const PRIV_R = r => /^(hesabim|yonetim|mesajlar|bildirimler|siparis-|ilan-ver$|ara$|ozel-takas-|davet-|widget-)/.test(r);
function routeToPath(r){ r=r||'home'; if(r==='home') return '/'; let m;
  if((m=r.match(/^server-([^-]+)(?:-(.+))?$/))){ const s=srv(m[1]); if(s) return '/server/'+slugify(s.name)+(m[2]?'/'+m[2]:''); }
  if(r.startsWith('ilan-')&&r!=='ilan-ver'){ const l=lst(r.slice(5)); if(l) return '/ilan/'+slugify(l.title)+'-'+l.id; }
  if(r.startsWith('rehber-')) return '/rehber/'+r.slice(7);
  if(r.startsWith('sayfa-')) return '/sayfa/'+r.slice(6);
  return '/'+r; }
function pathToRoute(p){ try{ p=decodeURIComponent(p||''); }catch(e){} p=p.replace(/^\/+|\/+$/g,'').replace(/\/index\.html$/,''); if(!p||p==='index.html') return 'home'; const a=p.split('/');
  if(a[0]==='server'&&a[1]){ const s=S.servers.find(x=>slugify(x.name)===a[1]); return s?'server-'+s.id+(a[2]?'-'+a[2]:''):'yok'; }
  if(a[0]==='ilan'&&a[1]) return 'ilan-'+a[1].slice(a[1].lastIndexOf('-')+1);
  if(a[0]==='rehber'&&a[1]) return 'rehber-'+a[1];
  if(a[0]==='sayfa'&&a[1]) return 'sayfa-'+a[1];
  return a.join('-'); }
const shareUrl = r => siteBase()+(S.set.seo&&S.set.seo.clean?routeToPath(r):'/#'+r);

function mdLite(src){ let html='', list=false, para=[];
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((#[A-Za-z0-9-]+|https?:\/\/[^\s)]+)\)/g,(m,a,h)=>h[0]==='#'?`<a href="${h}">${a}</a>`:`<a href="${h}" target="_blank" rel="noopener nofollow">${a}</a>`);
  const fp=()=>{ if(para.length){ html+='<p>'+inl(para.join(' '))+'</p>'; para=[]; } }; const fl=()=>{ if(list){ html+='</ul>'; list=false; } };
  String(src||'').split(/\n/).forEach(l=>{ const t=l.trim(); if(!t){ fp(); fl(); return; } if(t.startsWith('## ')){ fp(); fl(); html+='<h2>'+inl(t.slice(3))+'</h2>'; return; } if(t.startsWith('- ')){ fp(); if(!list){ html+='<ul>'; list=true; } html+='<li>'+inl(t.slice(2))+'</li>'; return; } fl(); para.push(t); }); fp(); fl(); return html; }

function sitemapUrls(){ const day=new Date().toISOString().slice(0,10), iso=t=>new Date(t).toISOString().slice(0,10); const U=[];

  S.servers.forEach(s=>{ const L=active().filter(l=>l.server===s.id); const lm=L.length?iso(Math.max(...L.map(l=>l.bump||l.t))):day; add('server-'+s.id,lm,'0.9','hourly'); M2CAT.filter(c=>c!=='ep'&&L.some(l=>l.cat===c)).forEach(c=>add('server-'+s.id+'-'+c,lm,'0.7','hourly')); if(srvEp(s)) add('server-'+s.id+'-ep',day,'0.7','daily'); });
  active().forEach(l=>add('ilan-'+l.id,iso(l.bump||l.t),'0.6','daily'));

const HTACCESS = `# ${'İtemHan'} · temiz adresler, HTTPS ve performans
Options -Indexes
RewriteEngine On

# HTTPS'e yönlendir (sunucunuz bir proxy arkasındaysa bu iki satırı kapatın)
RewriteCond %{HTTPS} !=on
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

# Statik SEO sayfaları: /server/ejderha2 -> server/ejderha2.html
RewriteCond %{REQUEST_URI} !\.html$
RewriteCond %{REQUEST_FILENAME}.html -f
RewriteRule ^(.+?)/?$ $1.html [L]

# Var olan dosya ve klasörler olduğu gibi açılır (sitemap.xml, robots.txt, qnbpay/, kimlik/ ...)
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

# Diğer tüm adresler (/server/..., /ilan/..., /rehber/...) siteyi açar
RewriteRule ^ index.html [L]

# SSL / güvenlik başlıkları (sertifika aktif olduktan sonra)
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
  Header always set Content-Security-Policy "upgrade-insecure-requests"
  <If "%{REQUEST_URI} !~ m#^/widget-#">
    Header always set X-Frame-Options "SAMEORIGIN"
  </If>
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain
</IfModule>
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/html "access plus 0 seconds"
  ExpiresByType image/svg+xml "access plus 30 days"
  ExpiresByType text/css "access plus 7 days"
  ExpiresByType application/javascript "access plus 7 days"
  ExpiresByType image/png "access plus 30 days"
  ExpiresByType image/jpeg "access plus 30 days"
</IfModule>
`;
